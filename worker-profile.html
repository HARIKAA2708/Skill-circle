
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillCircle - Worker Profile</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
    color: #222;
    padding-bottom: 40px;
}

header {
    background: #5b3cc4;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin-bottom: 6px;
}

.container {
    width: 94%;
    max-width: 700px;
    margin: 25px auto;
}

.card {
    background: white;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

.card h2 {
    color: #5b3cc4;
    margin-bottom: 18px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d5d5d5;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.skills-box {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.skill-option {
    border: 1px solid #ddd;
    padding: 11px;
    border-radius: 8px;
    background: #fafafa;
}

.skill-option label {
    margin: 0;
    font-weight: normal;
}

button {
    width: 100%;
    border: none;
    padding: 15px;
    margin-top: 22px;
    border-radius: 10px;
    background: #5b3cc4;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #472ca3;
}

.back {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #5b3cc4;
    text-decoration: none;
    font-weight: bold;
}

.note {
    background: #f0ecff;
    padding: 14px;
    border-radius: 10px;
    margin-top: 15px;
    line-height: 1.5;
}

@media(max-width:500px) {

    .skills-box {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<header>

    <h1>💼 SkillCircle Worker Profile</h1>

    <p>
        Tell owners about your skills and experience
    </p>

</header>


<div class="container">

<form id="workerForm">


    <!-- BASIC DETAILS -->

    <div class="card">

        <h2>👤 Basic Details</h2>

        <label>Full Name</label>

        <input
            type="text"
            id="workerName"
            placeholder="Enter your full name"
        >


        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
        >


        <label>Location / Area</label>

        <input
            type="text"
            id="area"
            placeholder="Example: Kukatpally"
        >


        <label>Preferred Work Type</label>

        <select id="workType">

            <option value="">
                Select work type
            </option>

            <option>House Cleaning</option>
            <option>Cooking</option>
            <option>Gardening</option>
            <option>Painting</option>
            <option>Babysitting</option>
            <option>Tailoring</option>
            <option>Electrical Work</option>
            <option>Digital Work</option>
            <option>Video Editing</option>
            <option>Graphic Design</option>
            <option>Student Helper</option>
            <option>Other</option>

        </select>

    </div>


    <!-- SKILLS -->

    <div class="card">

        <h2>🛠️ Your Skills</h2>

        <p>
            Select the work you can perform.
        </p>

        <div class="skills-box">

            <div class="skill-option">
                <label>
                    <input type="checkbox" value="House Cleaning">
                    House Cleaning
                </label>
            </div>

            <div class="skill-option">
                <label>
                    <input type="checkbox" value="Cooking">
                    Cooking
                </label>
            </div>

            <div class="skill-option">
                <label>
                    <input type="checkbox" value="Gardening">
                    Gardening
                </label>
            </div>

            <div class="skill-option">
                <label>
                    <input type="checkbox" value="Painting">
                    Painting
                </label>
            </div>

            <div class="skill-option">
                <label>
                    <input type="checkbox" value="Babysitting">
                    Babysitting
                </label>
            </div>

            <div class="skill-option">
                <label>
                    <input type="checkbox" value="Tailoring">
                    Tailoring
                </label>
            </div>

            <div class="skill-option">
                <label>
                    <input type="checkbox" value="Electrical Work">
                    Electrical Work
                </label>
            </div>

            <div class="skill-option">
                <label>
                    <input type="checkbox" value="Video Editing">
                    Video Editing
                </label>
            </div>

            <div class="skill-option">
                <label>
                    <input type="checkbox" value="Graphic Design">
                    Graphic Design
                </label>
            </div>

            <div class="skill-option">
                <label>
                    <input type="checkbox" value="Student Helper">
                    Student Helper
                </label>
            </div>

        </div>

    </div>


    <!-- EXPERIENCE -->

    <div class="card">

        <h2>📋 Previous Experience</h2>

        <label>Experience Description</label>

        <textarea
            id="experience"
            placeholder="Example: Worked as a house cleaner for 3 years..."
        ></textarea>


        <label>Experience Duration</label>

        <input
            type="text"
            id="experienceDuration"
            placeholder="Example: 3 years"
        >

    </div>


    <!-- AVAILABILITY -->

    <div class="card">

        <h2>🕒 Availability</h2>

        <label>Preferred Time</label>

        <select id="availability">

            <option value="">
                Select availability
            </option>

            <option>9:00 AM - 12:00 PM</option>
            <option>12:00 PM - 4:00 PM</option>
            <option>4:00 PM - 9:00 PM</option>
            <option>Flexible</option>

        </select>


        <label>Work Preference</label>

        <select id="workPreference">

            <option value="">
                Select preference
            </option>

            <option>Daily Work</option>
            <option>Part-time Work</option>
            <option>Temporary Work</option>

        </select>

    </div>


    <!-- EXTRA DETAILS -->

    <div class="card">

        <h2>📝 About Your Work</h2>

        <label>Additional Information</label>

        <textarea
            id="description"
            placeholder="Tell owners anything important about your work..."
        ></textarea>


        <div class="note">

            🔒 This prototype stores profile information
            locally on your device.

        </div>


        <button type="submit">
            Save Profile & Find Work →
        </button>

    </div>

</form>


<a
    class="back"
    href="role.html">

    ← Back to Role Selection

</a>

</div>


<script>

document
.getElementById("workerForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const selectedSkills =
        Array.from(
            document.querySelectorAll(
                '.skill-option input:checked'
            )
        )
        .map(input => input.value);


    const workerProfile = {

        name:
            document
            .getElementById("workerName")
            .value
            .trim(),

        phone:
            document
            .getElementById("phone")
            .value
            .trim(),

        area:
            document
            .getElementById("area")
            .value
            .trim(),

        workType:
            document
            .getElementById("workType")
            .value,

        skills:
            selectedSkills,

        experience:
            document
            .getElementById("experience")
            .value
            .trim(),

        experienceDuration:
            document
            .getElementById("experienceDuration")
            .value
            .trim(),

        availability:
            document
            .getElementById("availability")
            .value,

        workPreference:
            document
            .getElementById("workPreference")
            .value,

        description:
            document
            .getElementById("description")
            .value
            .trim(),

        savedAt:
            new Date().toISOString()

    };


    localStorage.setItem(
        "skillCircleWorkerProfile",
        JSON.stringify(workerProfile)
    );


    alert(
        "✅ Worker profile saved successfully!"
    );


    /* GO TO OWNER LIST */

    window.location.href = "ownerlist.html";

});

</script>

</body>
</html>
