<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SkillCircle - Owner Details</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
    color: #222;
}

header {
    background: #5b3cc4;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin-bottom: 6px;
}

.container {
    width: 94%;
    max-width: 1000px;
    margin: auto;
    padding: 25px 0;
}

.title {
    text-align: center;
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

.worker-summary {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
    margin-bottom: 25px;
}

.worker-summary h2 {
    color: #5b3cc4;
    margin-bottom: 10px;
}

.skills {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
}

.skill {
    background: #eee8ff;
    color: #5b3cc4;
    padding: 7px 10px;
    border-radius: 20px;
    font-size: 13px;
}

.owner-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(290px, 1fr));

    gap: 20px;
}

.owner-card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.owner-name {
    font-size: 22px;
    font-weight: bold;
    color: #5b3cc4;
    margin-bottom: 8px;
}

.work {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 15px;
}

.info {
    margin-top: 12px;
}

.label {
    font-size: 13px;
    font-weight: bold;
    color: #555;
    margin-bottom: 5px;
}

.value {
    color: #666;
    line-height: 1.5;
}

.match {
    display: inline-block;
    background: #e8f7ed;
    color: #16803c;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    margin-top: 12px;
}

.contact-btn {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #5b3cc4;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.back-btn {
    display: block;
    width: 100%;
    max-width: 400px;
    margin: 25px auto;
    padding: 13px;
    border-radius: 9px;
    background: white;
    border: 2px solid #5b3cc4;
    color: #5b3cc4;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
}

.no-jobs {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 15px;
    color: #777;
}

</style>

</head>


<body>

<header>

    <h1>
        🔎 SkillCircle
    </h1>

    <p>
        Owner Details & Available Work
    </p>

</header>


<div class="container">

    <h1 class="title">
        Owners Looking for Workers
    </h1>

    <p class="subtitle">
        Jobs matching your skills
    </p>


    <!-- WORKER SUMMARY -->

    <div
        class="worker-summary"
        id="workerSummary">
    </div>


    <!-- OWNER LIST -->

    <div
        class="owner-grid"
        id="ownerGrid">
    </div>


    <a
        class="back-btn"
        href="role.html">

        ← Back to Role Selection

    </a>

</div>


<script>

/*
=========================================
OWNER / JOB DATA
=========================================
*/

const owners = [

    {
        name: "Ramesh",
        work: "House Cleaning",
        area: "Kukatpally",
        date: "Today",
        time: "9:00 AM - 12:00 PM",
        payment: "₹800",
        description:
            "Looking for a worker for house cleaning."
    },


    {
        name: "Srinivas",
        work: "Gardening",
        area: "Miyapur",
        date: "Tomorrow",
        time: "12:00 PM - 4:00 PM",
        payment: "₹700",
        description:
            "Need help with garden maintenance."
    },


    {
        name: "Anjali",
        work: "Video Editing",
        area: "Gachibowli",
        date: "Today",
        time: "Flexible",
        payment: "₹1500",
        description:
            "Looking for a video editor for a project."
    },


    {
        name: "Kiran",
        work: "Painting",
        area: "Madhapur",
        date: "This Week",
        time: "4:00 PM - 9:00 PM",
        payment: "₹1200",
        description:
            "Need a worker for home painting."
    },


    {
        name: "Lakshmi",
        work: "Cooking",
        area: "Dilsukhnagar",
        date: "Tomorrow",
        time: "9:00 AM - 12:00 PM",
        payment: "₹900",
        description:
            "Looking for someone who can help with cooking."
    }

];


/*
=========================================
GET WORKER PROFILE
=========================================
*/

const savedProfile =
    localStorage.getItem(
        "skillCircleWorkerProfile"
    );


let worker = null;


if (savedProfile) {

    worker =
        JSON.parse(savedProfile);

}


/*
=========================================
DISPLAY WORKER
=========================================
*/

function displayWorker() {

    const summary =
        document.getElementById(
            "workerSummary"
        );


    if (!worker) {

        summary.innerHTML = `

            <h2>
                Worker Profile
            </h2>

            <p>
                No worker profile was found.
            </p>

        `;

        return;

    }


    summary.innerHTML = `

        <h2>
            👋 Welcome, ${worker.name}
        </h2>

        <p>
            📍 ${worker.area}
        </p>

        <p style="margin-top:8px;">
            🛠️ Your Skills
        </p>

        <div class="skills">

            ${worker.skills.map(function(skill) {

                return `
                    <span class="skill">
                        ${skill}
                    </span>
                `;

            }).join("")}

        </div>

    `;

}


/*
=========================================
DISPLAY OWNER JOBS
=========================================
*/

function displayOwners() {

    const grid =
        document.getElementById(
            "ownerGrid"
        );


    /*
    MATCH WORKER SKILLS WITH OWNER WORK
    */

    let matchingOwners = [];


    if (worker && worker.skills) {

        matchingOwners =
            owners.filter(function(owner) {

                return worker.skills.some(
                    function(skill) {

                        return (
                            skill.toLowerCase() ===
                            owner.work.toLowerCase()
                        );

                    }
                );

            });

    }


    /*
    IF NO MATCH
    */

    if (matchingOwners.length === 0) {

        grid.innerHTML = `

            <div class="no-jobs">

                <h2>
                    No matching jobs right now
                </h2>

                <p style="margin-top:10px;">

                    Try adding more skills to your
                    worker profile to see more opportunities.

                </p>

            </div>

        `;

        return;

    }


    /*
    CREATE OWNER CARDS
    */

    matchingOwners.forEach(function(owner) {

        const card =
            document.createElement("div");


        card.className =
            "owner-card";


        card.innerHTML = `

            <div class="owner-name">
                ${owner.name}
            </div>


            <div class="work">
                💼 ${owner.work}
            </div>


            <div class="info">

                <div class="label">
                    📍 Location
                </div>

                <div class="value">
                    ${owner.area}
                </div>

            </div>


            <div class="info">

                <div class="label">
                    📅 Date
                </div>

                <div class="value">
                    ${owner.date}
                </div>

            </div>


            <div class="info">

                <div class="label">
                    🕒 Time
                </div>

                <div class="value">
                    ${owner.time}
                </div>

            </div>


            <div class="info">

                <div class="label">
                    💰 Payment
                </div>

                <div class="value">
                    ${owner.payment}
                </div>

            </div>


            <div class="info">

                <div class="label">
                    📝 Work Details
                </div>

                <div class="value">
                    ${owner.description}
                </div>

            </div>


            <span class="match">
                ✓ Matches your skill
            </span>


            <button
                class="contact-btn"
                onclick="contactOwner('${owner.name}')">

                View Owner Details

            </button>

        `;


        grid.appendChild(card);

    });

}


/*
=========================================
OWNER DETAILS BUTTON
=========================================
*/

function contactOwner(name) {

    alert(
        "Owner: " +
        name +
        "\n\nThis prototype can connect you with the owner."
    );

}


displayWorker();

displayOwners();

</script>

</body>

</html>
