<label>Full Name</label>
<input type="text" id="workerName">

<label>Area</label>
<input type="text" id="workerArea">

<label>Which work do you want to do?</label>

<select id="workCategory">
    <option value="">Select work</option>
    <option>House Cleaning</option>
    <option>Gardening</option>
    <option>Painting</option>
    <option>Cooking</option>
    <option>Babysitting</option>
    <option>Video Editing</option>
    <option>Graphic Design</option>
    <option>Other</option>
</select>

<label>How much do you want to earn?</label>
<input
    type="number"
    id="salary"
    placeholder="Expected payment"
>

<label>Previous Experience</label>
<textarea
    id="previousExperience"
    placeholder="Describe your previous experience">
</textarea>

<label>Experience Evidence</label>

<input
    type="file"
    id="experienceEvidence"
    accept="image/*,video/*,.pdf"
>

<button onclick="saveWorkerProfile()">
    Save Profile
</button>
