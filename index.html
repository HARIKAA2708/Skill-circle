
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillCircle - Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f7ff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:500px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.1);
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:#3157d5;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#667085;
    margin-bottom:25px;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
}

input{
    width:100%;
    padding:14px;
    margin-top:7px;
    border:1px solid #d5dbea;
    border-radius:10px;
    font-size:16px;
}

.continue{
    display:block;
    width:100%;
    margin-top:25px;
    padding:15px;
    background:#3157d5;
    color:white;
    text-decoration:none;
    text-align:center;
    border-radius:10px;
    font-weight:bold;
    font-size:16px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">SkillCircle</div>

    <p class="subtitle">
        Connect skills with opportunities
    </p>

    <h1>Welcome 👋</h1>

    <label>Full Name</label>
    <input type="text" placeholder="Enter your full name">

    <label>Email</label>
    <input type="email" placeholder="Enter your email">

    <label>Phone Number</label>
    <input type="tel" placeholder="Enter your phone number">

    <label>Area / Location</label>
    <input type="text" placeholder="Enter your area">

    <!-- DIRECT LINK TO NEXT PAGE -->
    <a class="continue" href="role.html">
        Continue →
    </a>

</div>

</body>
</html>
